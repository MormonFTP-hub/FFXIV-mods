<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>Paper Crown</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=IM+Fell+English:ital@0;1&family=Schoolbell&display=swap">
<style>
/* Layout: one storybook "screen" (256x192 game pixels, scaled) centred on a night-plum ground; the touch pad stacks beneath it on phones. */
:root {
  --night: #17101c;
  --night-2: #241a2c;
  --line: #3a2c42;
  --paper: #eee2c8;
  --paper-2: #d6c4a0;
  --sepia: #3b2a22;
  --rose: #c0475c;
  --gold: #e6bd57;
  --bone: #f5eee1;
  --dust: #a99bb0;
  --box: #1e1526;
  --crayon: #39345a;
  --font-ui: "DotGothic16", "MS Gothic", "Osaka-Mono", "Courier New", monospace;
  --font-book: "IM Fell English", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-crayon: "Schoolbell", "Comic Sans MS", "Chalkboard SE", cursive;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--bone);
  font-family: var(--font-ui);
  overflow: hidden;
  overscroll-behavior: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
#app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding-block: 10px; box-sizing: border-box; }
#stage { position: relative; flex: none; background: #000; border-radius: 3px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 0 0 5px #0d0810, 0 24px 60px rgba(0,0,0,.65); outline: none; }
#stage:focus-visible { box-shadow: 0 0 0 2px var(--gold), 0 0 0 5px #0d0810; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: crisp-edges; image-rendering: pixelated; }
#ui { position: absolute; left: 0; top: 0; width: 256px; height: 192px; transform-origin: 0 0; font-size: 10px; line-height: 13px; pointer-events: none; overflow: hidden; }
#ui .click { pointer-events: auto; cursor: pointer; }

/* ---------- boxes ---------- */
.box { position: absolute; background: var(--box); border: 2px solid var(--bone); border-radius: 5px; box-shadow: 0 0 0 1px #000, inset 0 0 0 1px #000; padding: 4px 7px; box-sizing: border-box; }
#dlg { left: 5px; right: 5px; bottom: 5px; height: 54px; padding: 6px 9px; }
#dlg .tx { white-space: pre-wrap; overflow-wrap: break-word; }
#dlg .tx .h { visibility: hidden; }
#dlg .nm { position: absolute; left: 7px; top: -11px; background: var(--rose); color: var(--bone); border: 1px solid #000; border-radius: 3px; padding: 0 5px; font-size: 9px; line-height: 12px; }
#dlg .nx { position: absolute; right: 6px; bottom: 2px; font-size: 8px; color: var(--gold); animation: nx .7s steps(2) infinite; }
#dlg.book { background: var(--paper); color: var(--sepia); border-color: #7d5f43; font-family: var(--font-book); font-style: italic; font-size: 11px; line-height: 13.5px; }
#dlg.book .nx { color: var(--rose); }
#dlg.top { top: 5px; bottom: auto; }
@keyframes nx { 50% { transform: translateY(2px); } }

.opt { position: relative; padding: 0 2px 0 11px; white-space: nowrap; display: flex; justify-content: space-between; gap: 8px; }
.opt.sel::before { content: ""; position: absolute; left: 1px; top: 3px; border-left: 5px solid var(--gold); border-top: 3.5px solid transparent; border-bottom: 3.5px solid transparent; }
.opt.dis { color: #74687c; }
.opt .r { color: var(--dust); }
.opt.sel .r { color: var(--bone); }
#choice { right: 5px; bottom: 63px; min-width: 64px; padding: 4px 6px; }

.list .ttl { font-size: 8px; color: var(--gold); letter-spacing: .08em; margin: -1px 0 1px; text-transform: uppercase; }
.list .more { text-align: center; font-size: 7px; line-height: 7px; color: var(--dust); }
.desc { font-size: 9px; line-height: 12px; color: var(--bone); }
.desc em { color: var(--gold); font-style: normal; }
.stat { font-size: 9px; line-height: 11.5px; }
.stat .row { display: flex; justify-content: space-between; gap: 6px; }
.stat .k { color: var(--dust); }
.stat h4 { margin: 0 0 2px; font-weight: normal; color: var(--gold); font-size: 10px; display: flex; justify-content: space-between; }

/* ---------- paper notes (drawings, pages, decrees) ---------- */
#note { position: absolute; left: 22px; right: 22px; top: 14px; bottom: 16px; background:
  repeating-linear-gradient(to bottom, transparent 0 14px, rgba(80,110,170,.18) 14px 15px), #f4ebd7;
  color: var(--crayon); font-family: var(--font-crayon); font-size: 12px; line-height: 15px; padding: 9px 12px 8px; box-sizing: border-box;
  transform: rotate(-1.2deg); border-radius: 2px; box-shadow: 2px 3px 0 rgba(0,0,0,.45); display: flex; flex-direction: column; }
#note h3 { margin: 0 0 3px; font-weight: normal; font-size: 14px; line-height: 15px; color: var(--rose); }
#note .b { flex: 1; overflow: hidden; }
#note .f { font-family: var(--font-ui); font-size: 7px; color: #8a7f74; text-align: right; }
#note.page { font-family: var(--font-book); font-style: italic; font-size: 11px; line-height: 14px; color: var(--sepia); background: radial-gradient(ellipse at 50% 40%, #f3e7cd 50%, #dcc8a2 100%); transform: rotate(.8deg); }
#note.page h3 { font-style: normal; letter-spacing: .12em; font-size: 9px; text-transform: uppercase; }

/* ---------- chapter cards ---------- */
#card { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, var(--paper) 50%, var(--paper-2) 100%); color: var(--sepia); font-family: var(--font-book); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 14px 30px; box-sizing: border-box; opacity: 0; transition: opacity .7s ease; }
#card.on { opacity: 1; }
#card::before, #card::after { content: ""; position: absolute; inset: 7px; border: 1px solid rgba(59,42,34,.35); pointer-events: none; }
#card::after { inset: 10px; border-color: rgba(192,71,92,.35); }
#card .k { font-size: 8px; letter-spacing: .3em; text-transform: uppercase; color: var(--rose); }
#card h2 { font-size: 21px; line-height: 23px; font-weight: normal; margin: 7px 0 4px; text-wrap: balance; }
#card .orn { display: flex; align-items: center; gap: 5px; margin: 3px 0 8px; color: var(--rose); font-size: 7px; }
#card .orn::before, #card .orn::after { content: ""; width: 34px; height: 1px; background: currentColor; opacity: .6; }
#card .ep { font-style: italic; font-size: 10.5px; line-height: 14px; max-width: 180px; text-wrap: balance; }
#card .go { position: absolute; bottom: 16px; font-family: var(--font-ui); font-size: 7px; color: #8b7660; animation: nx 1s steps(2) infinite; }

/* ---------- title ---------- */
#title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 22px; }
#title h1 { font-family: var(--font-book); font-weight: normal; font-size: 31px; line-height: 31px; color: var(--paper); margin: 0; text-shadow: 0 2px 0 #000, 0 0 14px rgba(230,189,87,.35); }
#title h1 i { color: var(--gold); font-style: italic; }
#title .sub { font-family: var(--font-book); font-style: italic; font-size: 10px; color: var(--dust); margin-top: 3px; }
#title .opts { position: relative; margin-top: auto; margin-bottom: 24px; padding: 4px 10px 4px 6px; }
#title .foot { position: absolute; bottom: 5px; left: 0; right: 0; font-size: 7px; color: #8a7d92; }

/* ---------- battle ---------- */
#bcmd { left: 5px; right: 5px; top: 5px; padding: 3px 6px 4px; }
#bcmd .who { font-size: 8px; line-height: 10px; color: var(--gold); display: flex; justify-content: space-between; }
#bcmd .who span { color: var(--dust); }
#bcmd .row { display: flex; gap: 3px; margin-top: 2px; }
.chip { flex: 1; text-align: center; border: 1px solid #5d4f66; border-radius: 3px; font-size: 9px; line-height: 13px; }
.chip.sel { background: var(--rose); border-color: var(--bone); }
.chip.dis { color: #74687c; }
#bmsg { left: 5px; right: 5px; top: 5px; min-height: 22px; padding: 4px 8px; }
#bparty { position: absolute; left: 0; right: 0; bottom: 4px; display: flex; justify-content: center; gap: 8px; }
.pp { position: relative; width: 88px; padding: 3px 6px 4px; transition: transform .12s ease-out, border-color .12s; }
.pp.act { transform: translateY(-7px); border-color: var(--gold); }
.pp.tgt { border-color: #9fe0a8; }
.pp.dead { filter: grayscale(1) brightness(.6); }
.pp.hurt { animation: hurt .28s; }
@keyframes hurt { 0%, 100% { translate: 0 0; } 25% { translate: -2px 0; } 75% { translate: 2px 0; } }
.pp .n { font-size: 9px; line-height: 10px; display: flex; justify-content: space-between; }
.pp .n b { font-weight: normal; color: var(--rose); font-size: 7px; }
.meter { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: 3px; font-size: 7px; line-height: 9px; color: var(--dust); white-space: nowrap; }
.odo { display: flex; gap: 1px; }
.odo .d { width: 8px; height: 11px; overflow: hidden; position: relative; background: var(--bone); color: var(--box); border-radius: 1px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(0,0,0,.18); }
.odo .s { position: absolute; left: 0; top: 0; width: 100%; }
.odo .s i { display: block; height: 11px; line-height: 11px; text-align: center; font-style: normal; font-size: 10px; }
.meter.tp .odo .d { background: #d6cde6; }
.pp.mortal .meter.hp .odo .d { background: #f2aab7; }
.pop { position: absolute; transform: translate(-50%, 0); font-size: 12px; line-height: 12px; color: #fff; text-shadow: 1px 0 #000, -1px 0 #000, 0 1px #000, 0 -1px #000; animation: pop .95s ease-out forwards; white-space: nowrap; }
.pop.heal { color: #9fe0a8; }
.pop.smash { color: var(--gold); font-size: 13px; }
.pop.miss { color: var(--dust); font-size: 9px; }
.pop.hurt { color: #ffb3bf; }
@keyframes pop { 0% { transform: translate(-50%, 4px) scale(.6); opacity: 0; } 15% { transform: translate(-50%, -6px) scale(1.15); opacity: 1; } 30% { transform: translate(-50%, -4px) scale(1); } 80% { opacity: 1; } 100% { transform: translate(-50%, -16px); opacity: 0; } }
.combo { position: absolute; font-size: 9px; color: var(--gold); text-shadow: 1px 1px 0 #000; transform: translate(-50%, 0); white-space: nowrap; }
#won { position: absolute; left: 0; right: 0; top: 54px; text-align: center; font-family: var(--font-book); font-style: italic; font-size: 26px; line-height: 28px; color: var(--gold); text-shadow: 0 2px 0 #000, 0 0 10px rgba(0,0,0,.6); }

#toast { left: 50%; top: 6px; transform: translateX(-50%); padding: 2px 8px; font-size: 9px; white-space: nowrap; }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
#over { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; }
#over h2 { margin: 0; font-family: var(--font-book); font-style: italic; font-weight: normal; font-size: 20px; color: var(--paper); }
#over p { margin: 0 0 6px; font-size: 9px; color: var(--dust); }
#over .box { position: static; }

/* ---------- touch pad + hint ---------- */
#pad { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 480px; flex: none; }
#dpad { width: 128px; height: 128px; position: relative; touch-action: none; border-radius: 50%; background: radial-gradient(circle, var(--night-2) 0 58%, #1c1423 59%); box-shadow: inset 0 0 0 2px var(--line); }
#dpad b { position: absolute; width: 38px; height: 38px; background: var(--line); border-radius: 7px; transition: background .06s; }
#dpad b.on { background: var(--rose); }
#dpad .u { left: 45px; top: 7px; } #dpad .d { left: 45px; bottom: 7px; } #dpad .l { left: 7px; top: 45px; } #dpad .r { right: 7px; top: 45px; }
#btns { display: flex; gap: 12px; align-items: flex-end; }
.tb { width: 62px; height: 62px; border-radius: 50%; border: 2px solid #4a3a55; background: var(--night-2); color: var(--bone); font-family: var(--font-ui); font-size: 17px; touch-action: none; }
.tb.a { background: var(--rose); border-color: #e8a0ad; margin-bottom: 26px; }
.tb.on { filter: brightness(1.35); }
#hint { margin: 0; font-size: 11px; color: var(--dust); text-align: center; max-width: 64ch; line-height: 1.6; flex: none; text-wrap: balance; }
#hint kbd { font-family: var(--font-ui); background: var(--night-2); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--bone); }
#snd { font: inherit; color: var(--bone); background: var(--night-2); border: 1px solid var(--line); border-radius: 3px; padding: 0 6px; cursor: pointer; }
#snd:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
@media (pointer: coarse) { #hint .keys { display: none; } }
@media (prefers-reduced-motion: reduce) { #dlg .nx, #card .go { animation: none; } .pp.hurt { animation: none; } }
</style>

<div id="app">
  <div id="stage" tabindex="0" aria-label="Paper Crown game screen">
    <canvas id="cv" width="256" height="192"></canvas>
    <div id="ui">
      <div id="title" hidden>
        <h1>Paper <i>Crown</i></h1>
        <div class="sub">a storybook in four chapters</div>
        <div class="opts box" id="topts"></div>
        <div class="foot">Z / Enter to choose &nbsp;·&nbsp; X / Esc to go back</div>
      </div>
      <div id="bui" hidden>
        <div id="bparty"></div>
        <div id="bmsg" class="box" hidden></div>
        <div id="bcmd" class="box" hidden></div>
      </div>
      <div id="layer"></div>
      <div id="dlg" class="box" hidden><div class="nm" hidden></div><div class="tx"></div><div class="nx" hidden>▼</div></div>
      <div id="choice" class="box" hidden></div>
      <div id="note" hidden></div>
      <div id="card" hidden></div>
      <div id="over" hidden></div>
      <div id="toast" class="box" hidden></div>
      <div id="fade"></div>
    </div>
  </div>
  <div id="pad" hidden>
    <div id="dpad" aria-label="Move"><b class="u"></b><b class="d"></b><b class="l"></b><b class="r"></b></div>
    <div id="btns"><button class="tb b" id="tbB" aria-label="Back and menu">B</button><button class="tb a" id="tbA" aria-label="Confirm and talk">A</button></div>
  </div>
  <p id="hint"><span class="keys"><kbd>←↑↓→</kbd> or <kbd>WASD</kbd> walk · <kbd>Z</kbd>/<kbd>Enter</kbd> talk &amp; confirm · <kbd>X</kbd>/<kbd>Esc</kbd> menu &amp; back · </span><button id="snd" type="button">Sound: on</button></p>
</div>

<script>
'use strict';
// ============================================================
//  PAPER CROWN — core: helpers, input, sound
// ============================================================
const W = 256, H = 192, TS = 16;
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
function hash(x, y, s = 0) {
  let h = (x * 374761393 + y * 668265263 + s * 982451653) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const _rgb = new Map();
function rgb(c) {
  let v = _rgb.get(c);
  if (v) return v;
  let s = c.slice(1);
  if (s.length === 3) s = s.split('').map(ch => ch + ch).join('');
  v = [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)];
  _rgb.set(c, v);
  return v;
}
function shade(c, k) {
  const [r, g, b] = rgb(c);
  const f = v => clamp(Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k), 0, 255).toString(16).padStart(2, '0');
  return '#' + f(r) + f(g) + f(b);
}
function weighted(list) {
  const tot = list.reduce((s, m) => s + (m.w || 1), 0);
  let r = Math.random() * tot;
  for (const m of list) { r -= (m.w || 1); if (r <= 0) return m; }
  return list[list.length - 1];
}

// ============================================================
//  Input — keyboard, touch pad and taps all feed the same actions
// ============================================================
const Input = {
  down: Object.create(null),
  pressed: Object.create(null),
  held: Object.create(null),
  lastRep: Object.create(null),
  repTick: Object.create(null),
  okHooks: [],
  keymap: {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    KeyZ: 'ok', Enter: 'ok', Space: 'ok', NumpadEnter: 'ok',
    KeyX: 'back', Escape: 'back', Backspace: 'back', KeyC: 'back',
  },
  press(a) {
    if (!this.down[a]) {
      this.pressed[a] = true; this.held[a] = 0; this.lastRep[a] = 0;
      if (a === 'ok') for (const h of this.okHooks) h();
    }
    this.down[a] = true;
  },
  release(a) { this.down[a] = false; },
  hit(a) { if (this.pressed[a]) { this.pressed[a] = false; return true; } return false; },
  rep(a) {
    if (this.pressed[a]) { this.pressed[a] = false; return true; }
    if (this.repTick[a]) { this.repTick[a] = false; return true; }
    return false;
  },
  update(dt) {
    for (const a in this.down) {
      if (!this.down[a]) continue;
      this.held[a] += dt;
      if (this.held[a] > 0.34 && this.held[a] - this.lastRep[a] >= 0.085) { this.repTick[a] = true; this.lastRep[a] = this.held[a]; }
    }
  },
  endFrame() {
    for (const a in this.pressed) this.pressed[a] = false;
    for (const a in this.repTick) this.repTick[a] = false;
  },
  clear() { for (const a in this.down) this.down[a] = false; this.endFrame(); },
};
addEventListener('keydown', e => {
  if (e.code === 'KeyM' && !e.repeat) { AudioSys.init(); AudioSys.toggle(); return; }
  const a = Input.keymap[e.code];
  if (!a) return;
  if (e.target && e.target.id === 'snd' && (e.code === 'Enter' || e.code === 'Space')) return;
  e.preventDefault();
  AudioSys.init();
  if (e.repeat) return;
  Input.press(a);
});
addEventListener('keyup', e => { const a = Input.keymap[e.code]; if (a) Input.release(a); });
addEventListener('blur', () => Input.clear());

// ============================================================
//  Sound — a tiny Web Audio synth: music box, pulse, drums
// ============================================================
const AudioSys = {
  ctx: null, master: null, mus: null, fx: null, noise: null,
  muted: (() => { try { return localStorage.getItem('papercrown.muted') === '1'; } catch (e) { return false; } })(),
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }
    const c = this.ctx;
    this.master = c.createGain();
    this.master.gain.value = this.muted ? 0 : 0.85;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 3.5; comp.attack.value = 0.004; comp.release.value = 0.2;
    this.master.connect(comp); comp.connect(c.destination);
    this.mus = c.createGain(); this.mus.gain.value = 0.62; this.mus.connect(this.master);
    this.fx = c.createGain(); this.fx.gain.value = 0.75; this.fx.connect(this.master);
    // a soft echo so the music box sounds like it's in a big empty house
    const dl = c.createDelay(1); dl.delayTime.value = 0.27;
    const fb = c.createGain(); fb.gain.value = 0.3;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
    const wet = c.createGain(); wet.gain.value = 0.55;
    this.mus.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(wet); wet.connect(this.master);
    const len = c.sampleRate;
    this.noise = c.createBuffer(1, len, c.sampleRate);
    const d = this.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    if (c.state === 'suspended') c.resume().catch(() => {});
  },
  // One monotonic game clock for music and rhythm. It follows the audio clock while audio runs,
  // and falls back to performance.now() (without jumping) whenever the browser suspends audio.
  _last: performance.now() / 1000, _off: 0, _pBase: 0, _live: false,
  now() {
    const c = this.ctx, p = performance.now() / 1000;
    if (c && c.state === 'running') {
      if (!this._live) { this._live = true; this._off = this._last - c.currentTime; }
      const v = c.currentTime + this._off;
      if (v > this._last) this._last = v;
    } else {
      if (this._live) { this._live = false; this._pBase = this._last - p; }
      const v = p + this._pBase;
      if (v > this._last) this._last = v;
    }

const OUTLINE = '#140c18', EYE = '#2a1820', BLUSH = '#e8998c';

function makeSprite(w, h, paint, ol = OUTLINE) {
  const grid = new Array(w * h).fill(null);
  const P = {
    flip: false,
    px(x, y, c) { if (this.flip) x = w - 1 - x; if (c && x >= 0 && y >= 0 && x < w && y < h) grid[y * w + x] = c; },
    rect(x, y, ww, hh, c) { for (let j = 0; j < hh; j++) for (let i = 0; i < ww; i++) this.px(x + i, y + j, c); },
  };
  paint(P);
  const cw = w + 2, ch = h + 2;
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const g = c.getContext('2d');
  const img = g.createImageData(cw, ch), d = img.data;
  const filled = (x, y) => x >= 0 && y >= 0 && x < w && y < h && grid[y * w + x];
  const oc = ol ? rgb(ol) : null;
  for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) {
    const i = ((y + 1) * cw + (x + 1)) * 4;
    const v = filled(x, y);
    if (v) { const q = rgb(v); d[i] = q[0]; d[i + 1] = q[1]; d[i + 2] = q[2]; d[i + 3] = 255; }
    else if (oc && (filled(x - 1, y) || filled(x + 1, y) || filled(x, y - 1) || filled(x, y + 1))) { d[i] = oc[0]; d[i + 1] = oc[1]; d[i + 2] = oc[2]; d[i + 3] = 255; }
  }
  g.putImageData(img, 0, 0);
  return c;
}
const spriteCache = new Map();
function cached(key, w, h, paint) {
  let s = spriteCache.get(key);
  if (!s) { s = makeSprite(w, h, paint); spriteCache.set(key, s); }
  return s;
}

function paintChild(P, L, dir, fr) {
  const S = L.skin || '#f2c8a6';
  const HR = L.hair, HD = shade(HR, -0.3), HL = shade(HR, 0.22);
  const T = L.top, TD = L.topD || shade(T, -0.25);
  const hy = L.small ? 2 : 0;
  const R = (x, y, w, h, c) => P.rect(x, y + hy, w, h, c);
  const X = (x, y, c) => P.px(x, y + hy, c);
  if (dir === 3) P.flip = true;
  const side = dir >= 2, back = dir === 1;
  const ty = 12 + hy, th = L.small ? 2 : 3, sy = ty + th, ly = sy + 2;
  const SOCK = L.sock || (L.skirt ? '#ece5d8' : '#cfc6b8'), SHOE = L.shoe || '#3a2626';
  const leg = (x, w, lift) => {
    for (let y = ly; y < 19 - lift; y++) P.rect(x, y, w, 1, y === 18 - lift ? SOCK : S);
    P.rect(x, 19 - lift, w, 1, SHOE);
  };
  // legs
  if (!side) {
    leg(5, 2, fr === 2 ? 1 : 0); leg(9, 2, fr === 1 ? 1 : 0);
  } else if (fr === 0) leg(6, 3, 0);
  else if (fr === 1) { leg(4, 2, 0); leg(9, 2, 1); }
  else { leg(5, 2, 1); leg(8, 2, 0); }
  // body
  P.rect(5, ty, 6, th, T); P.rect(10, ty, 1, th, TD);
  if (!side) {
    P.rect(4, ty, 1, th, back ? TD : T); P.rect(11, ty, 1, th, TD);
    P.px(4, sy, S); P.px(11, sy, S);
    if (L.collar && !back) P.rect(6, ty, 4, 1, L.collar);
    if (L.bow && !back) P.rect(7, ty, 2, 1, L.bow);
  }
  if (L.skirt) { P.rect(5, sy, 6, 1, T); P.rect(4, sy + 1, 8, 1, TD); }
  else { P.rect(5, sy, 6, 2, L.shorts || TD); }
  if (side) {
    const ax = fr === 1 ? 6 : fr === 2 ? 8 : 7;
    P.rect(ax, ty, 2, th, TD);
    P.px(ax + (fr === 1 ? -1 : fr === 2 ? 1 : 0), sy, S);
    if (L.collar) P.rect(5, ty, 2, 1, L.collar);
  }
  if (L.sword && !side && !back) { P.rect(12, ty - 2, 1, 6, '#b08a5a'); P.rect(11, ty + 1, 3, 1, '#5a3a2a'); }
  // crown
  if (L.crown) {
    const C = L.crown, CD = shade(C, -0.3);
    R(4, 2, 8, 1, C); X(11, 2, CD);
    for (const x of [4, 5, 7, 8, 10, 11]) X(x, 1, C);
    for (const x of [4, 7, 8, 11]) X(x, 0, C);
    X(7, 2, L.paper ? '#c0475c' : '#c0475c');
  }
  // hair top
  R(5, 3, 6, 1, HR); R(4, 4, 8, 3, HR); X(6, 4, HL); X(7, 4, HL);
  const st = L.style;
  if (back) {
    R(4, 7, 8, 4, HR);
    if (st === 'short' || st === 'cap' || st === 'sailor' || st === 'pigtails') R(6, 11, 4, 1, S);
    else R(5, 11, 6, 1, HD);
    if (st === 'long' || st === 'ringlets') { R(4, 11, 8, 3, HR); R(5, 14, 6, 1, HD); }
    if (st === 'bob') R(4, 11, 8, 1, HD);
    if (st === 'plaits') for (let y = 10; y < 16; y++) { X(3, y, y % 2 ? HR : HD); X(12, y, y % 2 ? HR : HD); }
    if (st === 'pigtails') { R(2, 5, 2, 3, HR); R(12, 5, 2, 3, HR); }
  } else if (!side) {
    R(5, 7, 6, 4, S); R(6, 11, 4, 1, S);
    R(4, 7, 8, 1, HR);
    if (L.glasses) { R(5, 8, 6, 1, '#d4d6de'); X(6, 9, EYE); X(9, 9, EYE); }
    else { R(6, 8, 1, 2, EYE); R(9, 8, 1, 2, EYE); }
    X(5, 10, BLUSH); X(10, 10, BLUSH);
    if (L.freckles) { X(6, 10, '#c98a60'); X(9, 10, '#c98a60'); }
    if (st === 'bob') { R(4, 8, 1, 3, HR); R(11, 8, 1, 3, HR); X(4, 11, HD); X(11, 11, HD); }
    if (st === 'long' || st === 'ringlets') { R(4, 8, 1, 5, HR); R(11, 8, 1, 5, HR); R(3, 9, 1, 5, HD); R(12, 9, 1, 5, HD); }
    if (st === 'ringlets') for (const y of [10, 12, 14]) { X(3, y, HL); X(12, y, HL); }
    if (st === 'plaits') { R(4, 8, 1, 2, HR); R(11, 8, 1, 2, HR); for (let y = 10; y < 16; y++) { X(3, y, y % 2 ? HR : HD); X(12, y, y % 2 ? HR : HD); } X(3, 16, '#c0475c'); X(12, 16, '#c0475c'); }
    if (st === 'pigtails') { X(4, 8, HR); X(11, 8, HR); R(2, 5, 2, 3, HR); R(12, 5, 2, 3, HR); X(2, 7, HD); X(13, 7, HD); X(4, 5, '#c0475c'); X(11, 5, '#c0475c'); }
    if (st === 'short') { X(4, 8, HR); X(11, 8, HR); }
  } else {
    R(4, 7, 5, 4, S); R(5, 11, 3, 1, S); X(3, 9, S);
    R(4, 7, 5, 1, HR); R(9, 7, 3, 4, HR);
    if (L.glasses) { R(4, 8, 3, 1, '#d4d6de'); X(5, 9, EYE); } else R(5, 8, 1, 2, EYE);
    X(6, 10, BLUSH);
    if (st === 'bob') R(9, 11, 3, 1, HD);
    if (st === 'long' || st === 'ringlets') { R(9, 11, 3, 3, HR); R(10, 14, 2, 1, HD); }
    if (st === 'plaits') { for (let y = 11; y < 16; y++) X(10, y, y % 2 ? HR : HD); X(10, 16, '#c0475c'); }

    const C = L.cap, CD = shade(C, -0.3);

  }
}

// ============================================================
//  BATTLE BACKGROUNDS — wavy, swimming patterns (half resolution)
// ============================================================
const BGW = 128, BGH = 96;
const bgCan = document.createElement('canvas'); bgCan.width = BGW; bgCan.height = BGH;
const bgCtx = bgCan.getContext('2d');
const bgImg = bgCtx.createImageData(BGW, BGH);
function drawBattleBG(g, bg, t) {
  const cols = bg._c || (bg._c = bg.c.map(rgb));
  const n = cols.length, d = bgImg.data;
  const sp = bg.sp || 1, amp = REDUCED ? 0 : (bg.amp ?? 6), fq = bg.fq ?? 0.09;
  for (let y = 0; y < BGH; y++) {
    let off = Math.sin(y * fq + t * 2.2 * sp) * amp;
    if (bg.mode === 'i' && (y & 1)) off = -off;
    for (let x = 0; x < BGW; x++) {
      const u = x + off;
      const v = bg.mode === 'v' ? y + Math.sin(x * fq + t * 2 * sp) * amp : y;
      let p;
      switch (bg.s) {
        case 'stripes': p = Math.floor((u + v * 0.6 + t * 12 * sp) / 7); break;
        case 'checker': p = Math.floor((u + t * 8 * sp) / 8) + Math.floor((v + t * 5 * sp) / 8); break;
        case 'rings': { const dx = u - 64, dy = (v - 44) * 1.25; p = Math.floor(Math.sqrt(dx * dx + dy * dy) / 6 - t * 3 * sp); break; }
        case 'diamonds': p = Math.floor((Math.abs(u - 64) + Math.abs(v - 44)) / 6 - t * 3 * sp); break;
        case 'plaid': p = (Math.floor((u + t * 6 * sp) / 9) & 1) + 2 * (Math.floor((v + t * 4 * sp) / 9) & 1) + ((Math.floor(u / 3) + Math.floor(v / 3)) & 1 ? 0 : 1); break;
        case 'waves': p = Math.floor((v + Math.sin(u * 0.13 + t * sp * 2) * 7 + t * 6 * sp) / 6); break;
        case 'spiral': { const dx = u - 64, dy = v - 44; p = Math.floor(Math.atan2(dy, dx) * 3 / Math.PI + Math.sqrt(dx * dx + dy * dy) / 9 - t * 2 * sp); break; }
        default: p = 0;
      }
      const c = cols[((p % n) + n) % n];
      const i = (y * BGW + x) * 4;
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
    }
  }
  bgCtx.putImageData(bgImg, 0, 0);
  g.imageSmoothingEnabled = false;
  g.drawImage(bgCan, 0, 0, W, H);
}

const Fade = {
  el: $('#fade'), v: 0, target: 0, speed: 1, res: null, color: '#000',
  to(v, ms = 400, color) {
    if (color) { this.color = color; this.el.style.background = color; }
    if (this.res) { const r = this.res; this.res = null; r(); }
    return new Promise(r => {
      this.target = v;
      if (ms <= 0 || this.v === v) { this.v = v; this.apply(); r(); return; }
      this.speed = Math.abs(v - this.v) / (ms / 1000);
      this.res = r;
    });
  },
  update(dt) {
    if (this.v === this.target) return;
    const s = this.speed * dt;
    this.v = this.v < this.target ? Math.min(this.target, this.v + s) : Math.max(this.target, this.v - s);
    this.apply();
    if (this.v === this.target && this.res) { const r = this.res; this.res = null; r(); }
  },
  apply() { this.el.style.opacity = this.v; },
};

// ---------- tiles & collision ----------
function tileAt(tx, ty) { const M = World.M; return (tx < 0 || ty < 0 || tx >= M.w || ty >= M.h) ? ' ' : M.t[ty][tx]; }
function solidAt(px, py) { return isSolidTile(tileAt(Math.floor(px / TS), Math.floor(py / TS))); }
function boxHitsTiles(x, y, hw, top) {
  return solidAt(x - hw, y - top) || solidAt(x + hw, y - top) || solidAt(x - hw, y - 1) || solidAt(x + hw, y - 1) || solidAt(x, y - 1) || solidAt(x, y - top);
}
function boxHitsEnts(x, y, hw, top, self) {
  for (const e of World.ents) {
    if (!e.solid || e === self || e.hidden) continue;
    const ew = e.bw ?? 6, et = e.bt ?? 8, eb = e.bb ?? 0;
    if (x + hw > e.x - ew && x - hw < e.x + ew && y > e.y - et && y - top < e.y + eb) return true;
  }
  return false;
}
function blocked(e, x, y) {
  const hw = 5, top = 6;
  if (boxHitsTiles(x, y, hw, top)) return true;
  if (e.kind === 'player' && boxHitsEnts(x, y, hw, top, e)) return true;
  return false;
}
function tryMove(e, mx, my) {
  if (!mx && !my) return false;
  if (!blocked(e, e.x + mx, e.y + my)) { e.x += mx; e.y += my; return true; }
  // corner assist: slide around a corner when only a few pixels are in the way
  for (let k = 1; k <= 6; k++) for (const s of [-1, 1]) {
    if (mx && !blocked(e, e.x, e.y + s * k) && !blocked(e, e.x + mx, e.y + s * k)) { e.y += s * Math.min(1, k); return true; }
    if (my && !blocked(e, e.x + s * k, e.y) && !blocked(e, e.x + s * k, e.y + my)) { e.x += s * Math.min(1, k); return true; }
  }
  return false;
}

function loadMap(id, tx, ty, dir = 0) {
  const M = MAPS[id];

  rebake();
  const p = tileCenter(tx, ty);
  World.player = { kind: 'player', x: p.x, y: p.y, dir, fr: 0, walk: 0 };
  const back = DIRV[dir];
  World.dog = { kind: 'dog', x: p.x - back[0] * 14, y: p.y - back[1] * 14, dir, fr: 0, walk: 0, mode: 'follow' };
  World.trail = [];

  World.ents = People.spawn(id);
  if (M.spawns && M.spawnWhen && M.spawnWhen()) {
    for (const s of M.spawns) {
      const c = tileCenter(s.x, s.y);
      if (Math.hypot(c.x - p.x, c.y - p.y) < 64) continue;
      World.ents.push({ kind: 'mon', g: s.g, x: c.x, y: c.y, home: { x: c.x, y: c.y }, dir: irnd(0, 3), t: rnd(0, 2), state: 'wander', fr: 0, walk: 0, stun: 0,

}

function untilAudio(t) { return new Promise(r => { const f = () => (AudioSys.now() >= t ? r() : requestAnimationFrame(f)); f(); }); }
async function partyAct(a) {

async function doAttack(p, target) {

  }

function comboPress() {
  const C = Battle.combo; if (!C) return;
  const t = AudioSys.now() - AudioSys.lat(), d = t - C.expect, win = 0.14;

function hurtNow(e, p, pow) {

// ---------- per-frame ----------
function updateBattle(dt) {
  const B = Battle;
  B.t += dt;
  B.shake = Math.max(0, B.shake - dt);
  for (const e of B.enemies) {
    e.flash = Math.max(0, e.flash - dt); e.shake = Math.max(0, e.shake - dt); e.lunge = Math.max(0, e.lunge - dt * 1.4);
    if (!e.alive && e.dying > 0 && e.dying < 1) e.dying = Math.min(1, e.dying + dt * 1.2);
  }
  if (!B.frozen && !B.rollPause) {
    for (const p of B.party) {
      if (p.dead) continue;
      const rate = Math.max(9, p.maxhp / 6);
      if (p.roll > p.hp) p.roll = Math.max(p.hp, p.roll - rate * dt);
      else if (p.roll < p.hp) p.roll = Math.min(p.hp, p.roll + rate * 4 * dt);
      if (p.troll > p.tp) p.troll = Math.max(p.tp, p.troll - 16 * dt);
      else if (p.troll < p.tp) p.troll = Math.min(p.tp, p.troll + 40 * dt);
      if (p.hp <= 0 && p.roll <= 0.0001) faint(p);
    }
  }
  const C = B.combo;
  if (C && AudioSys.now() - AudioSys.lat() > C.expect + 0.14) endCombo();
  updatePanels();
}
function renderBattle(g) {
  const B = Battle;
  drawBattleBG(g, B.bg, B.t);
  const gr = g.createLinearGradient(0, 120, 0, H);
  gr.addColorStop(0, 'rgba(10,5,15,0)'); gr.addColorStop(1, 'rgba(10,5,15,.55)');
  g.fillStyle = gr; g.fillRect(0, 120, W, H - 120);
  const sx = B.shake > 0 && !REDUCED ? Math.sin(B.t * 80) * 3 * (B.shake / 0.25) : 0;
  g.save(); g.translate(sx, 0);
  const beat = Music.cur ? Math.pow(1 - Music.beatPhase(AudioSys.now()), 3) : 0;
  for (const e of B.enemies) {
    if (!e.alive && (e.dying >= 1 || e.dying === 0)) continue;
    const sc = (e.d.scale || 1) * (1 + 0.025 * beat * (e.status.sleep ? 0 : 1));
    const ex = e.x + (e.shake > 0 ? Math.sin(B.t * 90) * 3 : 0), ey = e.y + e.lunge * 12;
    g.fillStyle = 'rgba(10,5,15,.35)'; g.beginPath(); g.ellipse(e.x, e.y + 2, 26 * (e.d.scale || 1) * (e.d.boss ? 1.6 : 1), 5, 0, 0, 7); g.fill();
    renderEnemy(g, e.d.art, ex, ey, B.t + e.t, { flash: e.flash > 0, scale: sc * (1 + e.lunge * 0.25), dying: e.alive ? 0 : e.dying });
    if (e.status.sleep && e.alive) {
      g.fillStyle = '#f5eee1'; g.font = '9px "DotGothic16", monospace';
      for (let i = 0; i < 3; i++) { const k = (B.t * 0.7 + i / 3) % 1; g.globalAlpha = 1 - k; g.fillText('z', e.x + 16 + k * 10, enemyTop(e) + 10 - k * 16); }
      g.globalAlpha = 1;
    }
  }
  const cur = B.cursor;
  if (cur && cur.alive) {
    const y = enemyTop(cur) - 8 + Math.sin(B.t * 8) * 2;
    g.fillStyle = '#e6bd57'; g.beginPath(); g.moveTo(cur.x - 6, y - 6); g.lineTo(cur.x + 6, y - 6); g.lineTo(cur.x, y + 2); g.closePath(); g.fill();
    g.strokeStyle = OUTLINE; g.lineWidth = 1; g.stroke();
  }
  // the beat ring: shrinks onto the target exactly on the beat
  const ringFor = (e, at) => {
    const now = AudioSys.now() - AudioSys.lat();
    const k = clamp((at - now) / Music.beat, 0, 1);
    const cx = e.x, cy = (enemyTop(e) + e.y) / 2;
    g.strokeStyle = 'rgba(20,12,24,.55)'; g.lineWidth = 4;
    g.beginPath(); g.arc(cx, cy, 8 + 34 * k, 0, 7); g.stroke();
    g.strokeStyle = `rgba(240,200,95,${0.5 + (1 - k) * 0.5})`; g.lineWidth = 2;
    g.beginPath(); g.arc(cx, cy, 8 + 34 * k, 0, 7); g.stroke();
    g.strokeStyle = 'rgba(245,238,225,.5)'; g.lineWidth = 1; g.beginPath(); g.arc(cx, cy, 8, 0, 7); g.stroke();
  };
  if (B.combo) ringFor(B.combo.target, B.combo.expect);
  else if (B.ring) ringFor(B.ring.e, B.ring.t);
  g.restore();
  if (B.whiteout) { g.fillStyle = `rgba(255,250,240,${B.whiteout})`; g.fillRect(0, 0, W, H); }
}

// ---------- Wilf's Tuck Shop ----------
async function shop(greet) {
  await say('Wilf', greet || "Wilf's Tuck Shop! Buttons only. No IOUs, no crying, no dogs — oh, go on, the dog can stay.");
  const btnBox = panel(6, 6, 76, '', 'stat');
  const paint = () => { btnBox.innerHTML = `<div class="row"><span class="k">Buttons</span><span>${G.buttons}</span></div>`; };
  try {
    while (true) {
      paint();
      const stock = ['milk', 'tart', 'bone', 'spool', 'salts'];
      if (G.chapter >= 3) stock.push('poly');
      const kit = [];
      if (G.chapter >= 1 && !G.flags.bought_ribbon) kit.push('ribbon');
      if (G.chapter >= 2 && !G.flags.bought_cricket) kit.push('cricket');
      if (G.chapter >= 3 && !G.flags.bought_locket) kit.push('locket');
      const rows = [...stock.map(k => ({ id: k, kind: 'item', label: ITEMS[k].name, right: ITEMS[k].price, desc: ITEMS[k].desc + (G.items[k] ? ` (You have ${G.items[k]}.)` : '') })),
        ...kit.map(k => ({ id: k, kind: 'kit', label: EQUIP[k].name, right: EQUIP[k].price, desc: EQUIP[k].desc }))];
      const L = makeList({ x: 86, y: 6, w: 150, title: 'Tuck Shop', rows: 8, desc: true, items: rows.map(r => ({ ...r, dis: G.buttons < r.right })), allowDis: true });
      const i = await L.choose(); L.close();
      if (i < 0) break;
      const r = rows[i];
      if (G.buttons < r.right) { await say('Wilf', "That's more buttons than you've got. I can count, you know."); continue; }
      G.buttons -= r.right; sfx('item');
      if (r.kind === 'item') { G.items[r.id] = (G.items[r.id] || 0) + 1; }
      else {
        const q = EQUIP[r.id]; G.flags['bought_' + r.id] = true;
        if (q.slot === 'weapon') G.weapon = r.id; else G.charm = r.id;
        await say('Wilf', `One ${q.name}. Ada's ${q.slot === 'weapon' ? 'holding' : 'wearing'} it already. Smart.`);
      }
    }
  } finally { btnBox.remove(); }
  await say('Wilf', pick(['Pleasure doing buttons with you.', 'Come back when your pockets rattle.', 'Mind how you go. Mind the attic. Mind everything, really.']));
}

async function openParcel(e) {
  sfx('paper');
  G.flags['parcel_' + e.pid] = true;
  const i = World.ents.indexOf(e); if (i >= 0) World.ents.splice(i, 1);
  const c = e.give;
  if (c.item) { G.items[c.item] = (G.items[c.item] || 0) + 1; sfx('item'); return say(null, `Ada untied the string. Inside the brown paper: a ${ITEMS[c.item].name}!`); }
  if (c.btn) { G.buttons += c.btn; sfx('item'); return say(null, `Ada untied the string. Inside: ${c.btn} buttons, every one a different colour!`); }
  if (c.equip) {
    const q = EQUIP[c.equip]; sfx('item');
    await say(null, `Ada untied the string. Inside the brown paper: the ${q.name}!`);
    const cur = q.slot === 'weapon' ? EQUIP[G.weapon] : (G.charm ? EQUIP[G.charm] : { atk: 0, def: 0 });
    if ((q.atk || 0) + (q.def || 0) > (cur.atk || 0) + (cur.def || 0)) {
      if (q.slot === 'weapon') G.weapon = c.equip; else G.charm = c.equip;
      return say(null, `Ada is ${q.slot === 'weapon' ? 'holding' : 'wearing'} the ${q.name} now. (${q.desc.split('.')[0]}.)`);
    }
    return say(null, 'It isn’t better than what Ada has, so she leaves it for somebody else.');
  }
}

      if (G.chapter >= 3 && !G.flags.cellarIntro) { G.flags.cellarIntro = true; await nar('The cellar steps went down further than steps ought to.', 'At the bottom you could hear the sea, breathing in and out under the house.'); }
    },
  },
  trigger(id, tx, ty) {
    if (id === 'attic' && tx >= 20 && ty <= 5 && G.chapter >= 1 && !G.flags.gmothDone) return bossMoth;
    if (id === 'garden' && tx >= 13 && tx <= 17 && ty >= 15 && ty <= 17 && G.chapter >= 2 && !G.flags.coatDone) return bossCoat;
    if (id === 'cellar' && tx >= 19 && ty >= 14 && G.chapter >= 3 && !G.flags.nannyDone) return bossNanny;
    return null;
  },
  inspect(id, tx, ty) {
    const t = tileAt(tx, ty);
    if (id === 'court' && t === 'K') return chalkboard;
    if (id === 'garden' && t === 'G' && !G.flags.gateOpen) return gate;
    if (id === 'cellar' && t === 'J') return wheel;
    if (id === 'dorm' && tx === 2 && (ty === 8 || ty === 9)) return bedRest;
    return null;
  },
  sniffTarget(k) {
    const F = G.flags;
    if (k === 'thimblebox' && G.chapter === 1 && !F.curtainOpen) return { map: 'attic', tile: [22, 7], found: foundCurtain };
    if (k === 'glove' && G.chapter === 2 && !has('heartkey')) return { map: 'garden', tile: [3, 14], found: foundKey };
    if (k === 'soldier' && G.chapter === 3 && !F.nannyDone) {
      if (!F.sluice) return { map: 'cellar', tile: [3, 12], found: () => nar('Biscuit is barking at a big iron wheel. He looks at the wheel, then at Ada, then at the wheel again.', 'Subtle, Biscuit.') };
      return { map: 'cellar', tile: [21, 17], found: () => nar("Biscuit is standing at the edge of the black water, very still. Whatever he smells, it's close now.") };
    }
    return null;
  },
  sniffFlavor(k) {
    const t = {
      tin: "Biscuit sniffed the sewing tin and sneezed. Lavender. Ada's mother always smelled of lavender.",
      thimble: "It smells of Clementine's sewing basket. Biscuit wagged, politely.",
      thimblebox: 'Biscuit sniffed the velvet box, then sat down. He has already found where it goes.',
      glove: 'Biscuit sniffed the glove and looked at the garden. He has done all he can with it.',
      heartkey: 'It smells of rust and of Mr Feathers. Biscuit looked solemn.',
      rose: 'It smells of hymnbooks and crayons, and very faintly of a little boy.',
      cellarkey: 'Cold iron. Biscuit did not like it one bit.',
      cap: 'Biscuit sniffed the cap for a very long time. Then he lay down with his chin on his paws.',
      soldier: 'Biscuit sniffed the tin soldier and wagged once, slowly.',
    };
    if (/^page/.test(k)) return 'It smells of crayons and somebody’s pillow. Biscuit licked Ada’s hand.';
    return t[k] || 'Biscuit sniffed it, then looked up at Ada, waiting for a better idea.';
  },
  decor(g, cx, cy) {
    const M = World.M;
    if (G.flags.ending && M.id === 'garden') {
      for (let i = 0; i < 12; i++) {
        const bx = ((i * 61 + World.t * (5 + (i % 3) * 2)) % (M.w * TS + 40)) - 20 - cx;
        const by = 24 * TS + 3 + (i % 3) * 9 + Math.sin(World.t * 1.5 + i) * 1.5 - cy;
        fr(g, bx - 4, by + 3, 9, 2, '#efe5cc'); fr(g, bx - 3, by + 5, 7, 1, '#cbbd9e');
        g.fillStyle = '#f6eedc'; g.beginPath(); g.moveTo(bx, by - 5); g.lineTo(bx, by + 2); g.lineTo(bx + 4, by + 2); g.closePath(); g.fill();
      }
      return;
    }
    if (G.chapter < 4 || G.flags.ending || (M.id !== 'hall' && M.id !== 'court')) return;
    const x0 = Math.floor(cx / TS), y0 = Math.max(0, Math.floor(cy / TS));
    for (let ty = y0; ty <= Math.min(M.h - 1, y0 + 13); ty++) for (let tx = Math.max(0, x0); tx <= Math.min(M.w - 1, x0 + 17); tx++) {
      const ch = M.t[ty][tx], X = tx * TS - cx, Y = ty * TS - cy;
      if (ch === '#' && !WALLISH.has(tileAt(tx, ty + 1)) && hash(tx, ty, 9) < 0.7) {
        fr(g, X + 3, Y + 1, 10, 10, '#efe5cc'); fr(g, X + 3, Y + 1, 10, 1, '#d8c9aa');
        for (let i = 0; i < 3; i++) fr(g, X + 4, Y + 3 + i * 3, 3 + Math.floor(hash(tx, i, ty) * 6), 1, '#c0475c');
      } else if (!isSolidTile(ch) && hash(tx, ty, 4) < 0.14) {
        fr(g, X + 2 + hash(tx, ty, 5) * 8, Y + 4 + hash(ty, tx, 6) * 8, 5, 3, '#e9dcc0');
      }
    }
  },
};

  await Fade.to(0, 900);
  await nar('Larkspur House was very quiet.', 'Somebody had papered over every window. Every wall had a rule on it, in red crayon, over and over and over.');
  await note('Rule Seven', 'NOBODY SAYS HIS NAME\nNOBODY SAYS HIS NAME\nNOBODY SAYS HIS NAME\nNOBODY SAYS HIS NAME', '', 'red crayon, pressed very hard');
  await beginChapter(4);
}

// ---------- the last chapter ----------
async function finalCourt() {
  await autoWalk(8, 7); face(World.player, 1);
  await nar('The Court was waiting. Every one of them was wrapped in paper, still as dolls. Only Clementine moved.');
  await say('Clementine', "You brought him. Didn't you? You brought him home.");
  const i = await ask(null, 'Ada still has the little sailor’s cap.', ['Show her the cap', 'Say nothing']);
  if (i === 0) {
    await nar('Ada held out the cap.');
    await says('Clementine', ['No. No, no, no. That isn’t him.', "That's a hat. That's just a HAT."]);
  } else await says('Clementine', ["Why aren't you saying anything?", 'Say something. SAY SOMETHING.']);
  await says('Clementine', ['Kneel. Everybody kneel.', 'If everybody is kneeling, nobody can look at me.']);
  await nar("One by one, the paper crowns lifted off the children's heads and flew to her.");
  sfx('paper');
  const c = findEnt('clem');
  c.draw = dCrownBig; c.bw = 18;
  await sleep(600);
  const r = await battle(['crown'], { final: true, keepMusic: true, intro: 'The Paper Crown rose up over the classroom!' });
  if (r !== 'win') return;
  G.flags.finalDone = true;
  await ending();
}
async function ending() {
  Game.mode = 'black';
  Fade.to(0, 0);
  Music.play('ending');
  await nar('When the Paper Crown came undone, it was only paper. A great deal of paper. It took all morning to sweep up.',
    'Then, because nobody could think of anything better to do with it, they folded it all into boats.');
  G.flags.ending = true;
  await Fade.to(1, 0);
  loadMap('garden', 19, 22, 0);
  Object.assign(World.dog, tileCenter(20, 22), { mode: 'wait', dir: 0 });
  Game.mode = 'map';
  renderFrame();
  await Fade.to(0, 1200);
  await says('Clementine', ["He would have liked this. He'd have made a hundred of them and been sick on the cake.", "...Ada. I'm sorry I called you Smudge.",
    "There isn't a Court any more. No ranks. You're just Ada. And I'm just... Clemmy, I suppose."]);
  await says('Maude', ["I've written a new Book of Rules. It's very short.", 'Rule One: say their names.']);
  await say('Toby', 'And Rule Two: Biscuit is a knight. Sir Biscuit of the Puddles.');
  await say('Biscuit', 'Arf!');
  await say('Violet', "We think it's going to stop raining."); await say('Iris', 'We think so.');
  await say('Nell', "Mrs. Pell's awake! She says there's cake! She says she doesn't remember making any cake!");
  await say('Wilf', "Free cake. That's the best kind of cake.");
  await say('Dot', '...I like cake.');
  await nar('They set the boats on the water, and the tide took them out slowly, the way it takes everything.');
  G.flags.pipGhost = true; refreshPeople();
  sfx('bark'); emote(World.dog, '!', 1.6); face(World.dog, 3);
  await sleep(900);
  await nar('For just a moment, Ada thought she saw somebody small waving from the rocks: a boy in a sailor’s cap, wearing a crown made of paper.',
    'Biscuit saw him too. Dogs always do.');
  const pip = findEnt('pip'); if (pip) pip.hidden = true;
  await sleep(700);
  await nar('And it did stop raining. Not forever. But for a while.');
  await card('The End', 'Paper Crown', '...or at least, the end of the raining.');
  await note('Thank you for reading', `Ada reached level ${G.party[0].lv}. Biscuit reached level ${G.party[1].lv}.\nBiscuit sniffed ${G.sniffs} thing${G.sniffs === 1 ? '' : 's'}. The best combo was ${G.bestCombo} hit${G.bestCombo === 1 ? '' : 's'}.\nThe story took ${fmtTime(G.time)}.\n\nMade for two strange, sad, wonderful games about children, grief, and a very good dog.`, 'page', 'the end');
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  await Fade.to(1, 900);
  showTitle();
  await Fade.to(0, 600);
}

// ============================================================
//  MAIN — title, saving, game over, layout, the loop
// ============================================================
const SAVE_KEY = 'papercrown.save.v1';
function snapshot() {
  return JSON.parse(JSON.stringify({
    v: 1, chapter: G.chapter, flags: G.flags, items: G.items, keys: G.keys, buttons: G.buttons, weapon: G.weapon, charm: G.charm, rank: G.rank,
    time: G.time, sniffs: G.sniffs, bestCombo: G.bestCombo,
    party: G.party.map(p => ({ id: p.id, name: p.name, lv: p.lv, xp: p.xp, maxhp: p.maxhp, hp: p.hp, maxtp: p.maxtp, tp: p.tp, atk: p.atk, def: p.def, spd: p.spd })),
    map: World.id, x: World.player.x, y: World.player.y, dir: World.player.dir,
  }));
}
function saveGame() { const s = snapshot(); G.lastSave = s; try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) { /* storage may be blocked */ } }
function readSave() { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); return s && s.v === 1 && MAPS[s.map] ? s : null; } catch (e) { return null; } }
function applySave(s) {
  Object.assign(G, {
    chapter: s.chapter, flags: { ...s.flags }, items: { ...s.items }, keys: [...s.keys], buttons: s.buttons, weapon: s.weapon, charm: s.charm, rank: s.rank,
    time: s.time, sniffs: s.sniffs || 0, bestCombo: s.bestCombo || 0, party: s.party.map(p => ({ ...p })), lastSave: s,
  });
  $('#title').hidden = true; $('#over').hidden = true;
  loadMap(s.map, Math.floor(s.x / TS), Math.floor((s.y - 3) / TS), s.dir);
  Object.assign(World.player, { x: s.x, y: s.y });
  Object.assign(World.dog, { x: s.x, y: s.y + 1 });
  World.trail = [{ x: s.x, y: s.y, dir: s.dir }];
  camSnap();
  Game.mode = 'map';
}

// ---------- title ----------
const titleEl = $('#title'), toptsEl = $('#topts');
function showTitle() {
  Game.mode = 'title';
  UI.stack.length = 0;
  for (const id of ['#dlg', '#choice', '#note', '#card', '#over', '#bui']) $(id).hidden = true;
  layer.innerHTML = '';
  titleEl.hidden = false;
  Music.play('title');
  const save = readSave();
  const opts = save ? ['Continue the story', 'Begin again'] : ['Begin the story'];
  toptsEl.innerHTML = '';
  const rows = opts.map((o, i) => { const r = el('div', 'opt click', o); r.dataset.i = i; toptsEl.appendChild(r); return r; });
  let sel = 0;
  const paint = () => rows.forEach((r, i) => r.classList.toggle('sel', i === sel));
  paint();
  const w = {
    update() {
      if (Input.rep('up')) { sel = (sel + rows.length - 1) % rows.length; sfx('move'); paint(); }
      if (Input.rep('down')) { sel = (sel + 1) % rows.length; sfx('move'); paint(); }
      if (Input.hit('ok')) {
        sfx('ok'); UI.remove(w);
        if (save && sel === 0) run(async () => { await Fade.to(1, 400); applySave(save); renderFrame(); await Fade.to(0, 500); });
        else run(async () => { await Fade.to(1, 500); titleEl.hidden = true; Game.mode = 'black'; await Fade.to(0, 0); await newGame(); });
      }
    },
    pick(i) { sel = i; paint(); },
    tap() { return true; },
  };
  UI.push(w);
}
const stars = Array.from({ length: 40 }, () => [Math.random() * W, Math.random() * 100, Math.random() * 6]);
const titleRain = Array.from({ length: 70 }, () => [Math.random() * W, Math.random() * H, rnd(180, 260)]);
function drawTitle(g, t) {
  const sky = g.createLinearGradient(0, 0, 0, 140);
  sky.addColorStop(0, '#0b0816'); sky.addColorStop(1, '#2c1f3c');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  for (const [x, y, p] of stars) { g.fillStyle = `rgba(245,238,225,${0.25 + 0.25 * Math.sin(t * 2 + p)})`; g.fillRect(x, y, 1, 1); }
  const mg = g.createRadialGradient(198, 36, 4, 198, 36, 40);
  mg.addColorStop(0, 'rgba(239,227,200,.35)'); mg.addColorStop(1, 'rgba(239,227,200,0)');
  g.fillStyle = mg; g.fillRect(150, 0, 100, 90);
  g.fillStyle = '#efe3c8'; g.beginPath(); g.arc(198, 36, 11, 0, 7); g.fill();
  g.fillStyle = '#2c1f3c'; g.beginPath(); g.arc(203, 33, 10, 0, 7); g.fill();
  g.fillStyle = 'rgba(20,14,30,.85)';
  for (let i = 0; i < 4; i++) { const x = ((t * (4 + i) + i * 90) % (W + 120)) - 60; g.beginPath(); g.ellipse(x, 52 + i * 14, 50, 6, 0, 0, 7); g.fill(); }
  // sea
  g.fillStyle = '#16222f'; g.fillRect(0, 136, W, H - 136);
  for (let i = 0; i < 26; i++) { const y = 140 + (i * 7) % 52, x = (i * 53 + t * (6 + i % 4)) % W; g.fillStyle = 'rgba(120,150,180,.25)'; g.fillRect(x, y, 6 + (i % 3) * 3, 1); }
  for (let i = 0; i < 8; i++) { g.fillStyle = `rgba(239,227,200,${0.18 + 0.08 * Math.sin(t * 3 + i)})`; g.fillRect(192 + Math.sin(t + i) * 4, 140 + i * 6, 12 - i, 1); }
  // lighthouse far away
  g.fillStyle = '#0e0a14'; g.fillRect(240, 120, 4, 16); g.fillRect(239, 118, 6, 3);
  const beam = (Math.sin(t * 0.9) + 1) / 2;
  g.fillStyle = `rgba(239,227,200,${0.08 + beam * 0.12})`; g.beginPath(); g.moveTo(242, 119); g.lineTo(150 + beam * 60, 108); g.lineTo(150 + beam * 60, 126); g.closePath(); g.fill();
  g.fillStyle = '#e6bd57'; g.fillRect(241, 118, 2, 2);
  // cliff and the house
  g.fillStyle = '#100a14';
  g.beginPath(); g.moveTo(0, H); g.lineTo(0, 112); g.lineTo(30, 106); g.lineTo(120, 108); g.lineTo(150, 118); g.lineTo(162, 134); g.lineTo(170, H); g.closePath(); g.fill();
  g.fillStyle = '#0b0710';
  g.fillRect(28, 72, 78, 38); g.beginPath(); g.moveTo(22, 74); g.lineTo(67, 50); g.lineTo(112, 74); g.closePath(); g.fill();
  g.fillRect(92, 52, 16, 58); g.beginPath(); g.moveTo(88, 54); g.lineTo(100, 34); g.lineTo(112, 54); g.closePath(); g.fill();
  g.fillRect(40, 54, 6, 12);
  const lit = [[36, 82], [52, 82], [76, 82], [36, 96], [64, 96], [98, 62]];
  lit.forEach(([x, y], i) => {
    const on = i === 5 ? 0.6 + 0.4 * Math.sin(t * 5) * Math.sin(t * 3.3) : i % 2 ? 0.9 : 0.35;
    g.fillStyle = `rgba(230,189,87,${on})`; g.fillRect(x, y, 6, 8); g.fillStyle = '#0b0710'; g.fillRect(x + 2.5, y, 1, 8);
  });
  // a girl and a dog on the cliff path
  g.fillStyle = '#0b0710'; g.fillRect(134, 108, 3, 7); g.fillRect(133, 104, 5, 5); g.fillRect(139, 112, 6, 3); g.fillRect(144, 110, 2, 2);
  // rain
  g.fillStyle = 'rgba(190,205,230,.35)';
  for (const r of titleRain) { const y = (r[1] + t * r[2]) % H, x = (r[0] - t * 20 + W * 4) % W; g.fillRect(x, y, 1, 5); }
}

// ---------- game over ----------
async function gameOver() {
  Game.mode = 'black';
  Music.play('gameover');
  const ov = $('#over');
  ov.innerHTML = '';
  ov.append(el('h2', '', 'The storybook closed.'), el('p', '', 'Ada and Biscuit could not go on.'));
  const box = el('div', 'box'); ov.appendChild(box);
  ov.hidden = false;
  await Fade.to(0, 600);
  const save = G.lastSave || readSave();
  const opts = save ? ['Open it again', 'Back to the title'] : ['Back to the title'];
  const rows = opts.map((o, i) => { const r = el('div', 'opt click', o); r.dataset.i = i; box.appendChild(r); return r; });
  let sel = 0;
  const paint = () => rows.forEach((r, i) => r.classList.toggle('sel', i === sel));
  paint();
  const i = await new Promise(res => {
    const w = {
      update() {
        if (Input.rep('up') || Input.rep('down')) { sel = (sel + 1) % rows.length; sfx('move'); paint(); }
        if (Input.hit('ok')) { sfx('ok'); UI.remove(w); res(sel); }
      },
      pick(k) { sel = k; paint(); }, tap() { return true; },
    };
    UI.push(w);
  });
  await Fade.to(1, 500);
  ov.hidden = true;
  if (save && i === 0) { applySave(save); renderFrame(); await Fade.to(0, 500); }
  else { showTitle(); await Fade.to(0, 500); }
}

// ---------- layout & touch ----------
const padEl = $('#pad'), hintEl = $('#hint'), appEl = $('#app');
function layout() {
  const aw = appEl.clientWidth;
  const ah = appEl.clientHeight - 20 - (padEl.hidden ? 0 : padEl.offsetHeight + 10) - hintEl.offsetHeight - 10;
  let s = Math.min(aw / W, ah / H);
  if (s >= 2) s = Math.floor(s * 4) / 4;
  s = Math.max(0.6, s);
  stage.style.width = Math.round(W * s) + 'px';
  stage.style.height = Math.round(H * s) + 'px';
  uiEl.style.transform = `scale(${s})`;
  uiScale = s;
}
addEventListener('resize', layout);
function showPad() { if (padEl.hidden) { padEl.hidden = false; layout(); } }
if (matchMedia('(pointer: coarse)').matches) padEl.hidden = false;
addEventListener('touchstart', showPad, { passive: true, once: true });
(function setupPad() {
  const dpad = $('#dpad'), bs = { u: dpad.querySelector('.u'), d: dpad.querySelector('.d'), l: dpad.querySelector('.l'), r: dpad.querySelector('.r') };
  let id = null;
  const set = (a, on, b) => { if (on) Input.press(a); else Input.release(a); b.classList.toggle('on', on); };
  const apply = e => {
    const r = dpad.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2), dead = r.width * 0.12;
    set('up', dy < -dead && Math.abs(dy) > Math.abs(dx) * 0.45, bs.u);
    set('down', dy > dead && Math.abs(dy) > Math.abs(dx) * 0.45, bs.d);
    set('left', dx < -dead && Math.abs(dx) > Math.abs(dy) * 0.45, bs.l);
    set('right', dx > dead && Math.abs(dx) > Math.abs(dy) * 0.45, bs.r);
  };
  const end = () => { id = null; set('up', false, bs.u); set('down', false, bs.d); set('left', false, bs.l); set('right', false, bs.r); };
  dpad.addEventListener('pointerdown', e => { AudioSys.init(); id = e.pointerId; dpad.setPointerCapture(id); apply(e); e.preventDefault(); });
  dpad.addEventListener('pointermove', e => { if (e.pointerId === id) apply(e); });
  dpad.addEventListener('pointerup', end); dpad.addEventListener('pointercancel', end);
  for (const [btnId, act] of [['#tbA', 'ok'], ['#tbB', 'back']]) {
    const b = $(btnId);
    b.addEventListener('pointerdown', e => { AudioSys.init(); e.preventDefault(); b.classList.add('on'); Input.press(act); });
    const up = () => { b.classList.remove('on'); Input.release(act); };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
    b.addEventListener('contextmenu', e => e.preventDefault());
  }
})();

// ---------- the loop ----------
function renderFrame() {
  if (Game.mode === 'map' && World.M) { renderWorld(ctx); drawScreenTexture(ctx, Game.frame); if (Battle.trans) drawSwirl(ctx); }
  else if (Game.mode === 'battle') { renderBattle(ctx); drawScreenTexture(ctx, Game.frame); }
  else if (Game.mode === 'title') { drawTitle(ctx, performance.now() / 1000); drawScreenTexture(ctx, Game.frame); }
  else { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
}
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  Game.frame++;
  try {
    Input.update(dt);
    Music.update();
    Fade.update(dt);
    UI.update(dt);
    if (Game.mode === 'map' && World.M) { updateWorld(dt); G.time += dt; }
    else if (Game.mode === 'battle') { updateBattle(dt); G.time += dt; }
    renderFrame();
  } catch (e) { console.error(e); }
  Input.endFrame();
  requestAnimationFrame(frame);
}
function start(data) {
  updateSndBtn();
  layout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  if (data && data.save && MAPS[data.save.map]) { applySave(data.save); }
  else showTitle();
  requestAnimationFrame(t => { lastT = t; frame(t); });
  stage.focus({ preventScroll: true });
}
window.claude?.hot?.snapshot?.(() => ({ save: Game.mode === 'map' && World.M ? snapshot() : G.lastSave }));
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});

</script>
